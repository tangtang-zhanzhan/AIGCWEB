<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>跳转中…</title>
  <script>
    var segments = window.location.pathname.split('/').filter(Boolean)
    segments.pop()
    window.location.replace(segments.join('/') + '/')
  </script>
  <meta http-equiv="refresh" content="0;url=./">
</head>
<body>
  <p>页面跳转中…</p>
</body>
</html>
